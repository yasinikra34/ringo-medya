<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07050c">
<title>Meyve Kes · Ringo</title>
<!--
=====================================================================
  MEYVE KES — Siteye entegrasyon
---------------------------------------------------------------------
  ÜCRETSİZ oyun (2026-11-27): giriş puanı ve katlamalı ödül yok (bahis
  çağrışımı). Ödül yalnız profil XP'si; sunucu verir (/api/skill-games).

  window.SliceHost = {
    getUser: async () => ({ name, avatar }),
    charge:  async (mode) => ({ ok:true, sessionId }),   // oturum açar, puan düşmez
    finish:  async (data) => ({ ok, status, xp, kademe, week_rank }) // data: {sessionId,mode,score,fruits,bestCombo}
  };
  SliceHost yoksa oyun demo modda (yalnız skor) çalışır.
=====================================================================
-->
<style>
:root{
  --neon:#b56cff; --neon2:#8a3dff; --violet:#5a1fb0; --velvet:#2a0b4a;
  --gold:#a77a35; --gold2:#6e4d1c; --txt:#f1e9ff; --muted:#a898c8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;color:var(--txt);font-family:-apple-system,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#050308}
body{
  background:
    radial-gradient(130% 55% at 50% -5%, #2b0c52 0%, transparent 62%),
    radial-gradient(100% 45% at 50% 105%, #1e0740 0%, transparent 65%),
    linear-gradient(118deg, transparent 38%, rgba(255,255,255,.035) 39%, transparent 41.5%),
    linear-gradient(64deg, transparent 63%, rgba(190,150,255,.045) 64%, transparent 65.2%),
    linear-gradient(158deg, transparent 18%, rgba(255,255,255,.028) 19%, transparent 20.3%),
    linear-gradient(30deg, transparent 80%, rgba(255,255,255,.02) 81%, transparent 82%),
    #07050b;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 10px);gap:8px}

/* ---------- Üst bar ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;height:46px}
.player{display:flex;align-items:center;gap:9px;min-width:0;padding:4px 12px 4px 4px;border-radius:30px;
  background:linear-gradient(180deg,#24113d,#12081f);border:1px solid rgba(181,108,255,.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 6px 14px rgba(0,0,0,.5)}
.avatar{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:15px;
  background:radial-gradient(circle at 35% 30%,#c79bff,#5d22b4 60%,#250a4d);border:1.5px solid var(--gold);background-size:cover;background-position:center;
  box-shadow:inset 0 2px 3px rgba(255,255,255,.35)}
.pname{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.bal{display:flex;align-items:center;gap:5px;font-size:13px;color:#e6d6ff}
.bal b{font-variant-numeric:tabular-nums}
.bal small{color:var(--muted);font-size:10px;letter-spacing:.06em}
.coin{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f4dca0,#a77a35 55%,#4e3410);box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.brand{font-weight:900;font-size:15px;letter-spacing:.14em;text-align:center;line-height:1;
  background:linear-gradient(180deg,#ffffff,#d8b8ff 55%,#8a4dff);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:8.5px;letter-spacing:.42em;margin-top:3px;color:#b99a62;-webkit-text-fill-color:#b99a62}
.icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:linear-gradient(180deg,#24113d,#12081f);border:1px solid rgba(181,108,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.icon svg{width:19px;height:19px;fill:none;stroke:#e3cfff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- HUD ---------- */
.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.hcell{position:relative;height:50px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#1b0d2e 0%,#0c0614 100%);border:1px solid rgba(181,108,255,.28);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 -8px 16px rgba(0,0,0,.35)}
.hcell small{font-size:9px;letter-spacing:.2em;color:var(--muted);font-weight:700}
.hcell b{font-size:22px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#fff,#d5b3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hcell.score b{font-size:26px}
.lives{display:flex;gap:9px;margin-top:3px}
.lives i{width:20px;height:20px;position:relative;opacity:.9}
.lives i:before,.lives i:after{content:"";position:absolute;left:8px;top:0;width:4px;height:20px;border-radius:2px;
  background:linear-gradient(180deg,#5c4a75,#2c2140)}
.lives i:before{transform:rotate(45deg)} .lives i:after{transform:rotate(-45deg)}
.lives i.lost:before,.lives i.lost:after{background:linear-gradient(180deg,#ff6b8a,#c3102f)}
.lives i.lost{animation:pop .35s}
@keyframes pop{0%{transform:scale(1.7)}100%{transform:scale(1)}}
#timer{display:none}
.hcell.danger b{background:linear-gradient(180deg,#fff,#ff7a9a);-webkit-background-clip:text;background-clip:text}

/* ---------- Kabin (görsel çerçeve) ---------- */
.cab{position:relative;flex:1;min-height:0;display:flex;border-style:solid;border-color:transparent;border-width:70px 46px 105px 44px;
  border-image-repeat:stretch;margin:0 -4px}
.tank{position:relative;flex:1;min-height:0;overflow:hidden;background:#07040d;touch-action:none;border-radius:5px}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(112deg,transparent 0 14%,rgba(255,255,255,.065) 14% 21%,transparent 21% 27%,rgba(255,255,255,.03) 27% 29%,transparent 29%),
    linear-gradient(180deg,rgba(255,255,255,.07),transparent 9%,transparent 90%,rgba(140,70,255,.09));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),inset 0 0 50px rgba(0,0,0,.65)}

/* ---------- Paneller ---------- */
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity .35s,transform .35s}
.ov.hidden{opacity:0;visibility:hidden;transform:scale(.96)}
.panel{pointer-events:auto;width:93%;max-width:350px;padding:14px 11px 12px;border-radius:20px;text-align:center;position:relative;
  background:
    radial-gradient(120% 70% at 50% 0%,rgba(120,50,200,.35),transparent 60%),
    linear-gradient(180deg,rgba(38,13,68,.9),rgba(13,5,24,.94));
  border:1px solid rgba(181,108,255,.5);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 4px rgba(0,0,0,.25),0 24px 50px rgba(0,0,0,.7);
  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.panel:before{content:"";position:absolute;left:24%;right:24%;top:-1px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#b8904a,transparent)}
.logo{font-weight:900;line-height:.95;letter-spacing:.04em}
.logo span{display:block;font-size:34px;white-space:nowrap;background:linear-gradient(180deg,#fff 10%,#e2c9ff 45%,#9a55ff 60%,#d9b8ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #2a0b52)}
.logo em{display:block;font-style:normal;font-size:15px;letter-spacing:.6em;margin:4px 0 0 .6em;color:#c4a066}
.sub{font-size:11.5px;color:var(--muted);margin:8px 0 12px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;border-radius:14px;background:rgba(0,0,0,.45);border:1px solid rgba(181,108,255,.2)}
.seg button{padding:8px 4px;border-radius:10px;font-weight:800;font-size:13px;letter-spacing:.08em;color:#bfaedd;transition:.2s}
.seg button small{display:block;white-space:nowrap;font-size:8.5px;font-weight:600;letter-spacing:.02em;color:#8f80ad;margin-top:2px}
.seg button.on{color:#fff;background:linear-gradient(180deg,#9b5cf0,#5a1fb0 55%,#3d1180);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 10px rgba(60,10,140,.5)}
.seg button.on small{color:#e3d0ff}
.lbl{font-size:9.5px;letter-spacing:.24em;color:var(--muted);font-weight:800;margin:12px 0 7px}
.chips{display:flex;justify-content:center;gap:9px}
.chip{width:48px;height:48px;border-radius:50%;font-weight:900;font-size:15px;position:relative;
  background:radial-gradient(circle at 50% 50%,#1a0b2e 0 52%,transparent 53%),
    repeating-conic-gradient(from 0deg,#7d3ae0 0 15deg,#3a1280 15deg 30deg);
  box-shadow:inset 0 0 0 2px #2a0c55,inset 0 2px 4px rgba(255,255,255,.25),0 5px 10px rgba(0,0,0,.55);transition:.18s}
.chip:after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(160deg,rgba(255,255,255,.28),transparent 45%)}
.chip.on{transform:translateY(-3px);box-shadow:inset 0 0 0 2px #b8904a,inset 0 2px 4px rgba(255,255,255,.3),0 0 0 2px #6e4d1c,0 8px 16px rgba(0,0,0,.6)}
.chip.off{opacity:.35}
.pay{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:12px}
.pay div{padding:6px 1px;border-radius:9px;background:rgba(0,0,0,.4);border:1px solid rgba(181,108,255,.18);font-size:9px;white-space:nowrap;color:var(--muted)}
.pay b{display:block;font-size:14px;color:#ecdcff;font-weight:900}
.play{position:relative;width:100%;margin-top:13px;height:54px;border-radius:16px;font-weight:900;font-size:19px;letter-spacing:.16em;color:#fff;overflow:hidden;
  background:linear-gradient(180deg,#c99aff 0%,#8a3cf0 38%,#5a17b8 52%,#6f28d6 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,0,0,.25),0 0 0 1.5px #6e4d1c,0 10px 22px rgba(70,10,160,.55);
  text-shadow:0 2px 0 rgba(40,0,90,.6);transition:transform .12s,filter .2s}
.play:before{content:"";position:absolute;left:6%;right:6%;top:3px;height:42%;border-radius:12px 12px 30px 30px;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0))}
.play small{display:block;font-size:10.5px;letter-spacing:.14em;font-weight:700;color:#efe2ff;margin-top:-1px}
.play:active{transform:scale(.97)}
.play[disabled]{filter:grayscale(.7) brightness(.7)}
.play.sm{height:48px;font-size:14px;margin-top:0}
.bestline{margin-top:10px;font-size:11.5px;color:var(--muted)} .bestline b{color:#e9d9ff}
.otitle{font-weight:900;font-size:13px;letter-spacing:.32em;color:#c4a066}
.oscore{font-size:64px;font-weight:900;line-height:1;margin-top:6px;background:linear-gradient(180deg,#fff,#d7b8ff 60%,#9049ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.olbl{font-size:9.5px;letter-spacing:.3em;color:var(--muted);font-weight:800;margin:2px 0 10px}
.orow{display:flex;justify-content:space-between;font-size:13px;padding:7px 4px;border-top:1px solid rgba(181,108,255,.14);color:var(--muted)}
.orow b{color:#efe4ff}
.oreward{margin:10px 0 12px;padding:10px;border-radius:12px;font-size:22px;font-weight:900;
  background:linear-gradient(180deg,rgba(167,122,53,.18),rgba(0,0,0,.3));border:1px solid rgba(184,144,74,.45);color:#f0dcb0}
.oreward.zero{font-size:15px;color:#b7a7d4;border-color:rgba(181,108,255,.25);background:rgba(0,0,0,.3)}
.obtns{display:grid;grid-template-columns:1fr 48px 1.5fr;gap:8px}.obtns .play{order:3}
.orank{margin:-4px 0 12px;font-size:12px;color:#d9c4ff;min-height:15px}
.ghost{height:48px;border-radius:14px;font-weight:800;letter-spacing:.14em;font-size:13px;background:rgba(0,0,0,.45);border:1px solid rgba(181,108,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-20px);opacity:0;padding:9px 16px;border-radius:20px;font-size:13px;font-weight:700;white-space:nowrap;z-index:5;
  background:rgba(20,8,36,.95);border:1px solid rgba(181,108,255,.5);transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.go{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-weight:900;font-size:64px;color:#fff;opacity:0;
  text-shadow:0 4px 0 #3a0d7a,0 0 24px rgba(160,90,255,.5)}
.go.anim{animation:go .8s ease-out}
@keyframes go{0%{opacity:0;transform:scale(1.8)}25%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(.9)}}

.link{color:#d9c4ff;text-decoration:underline;font-size:11.5px}
.ghost.sq{font-size:20px;letter-spacing:0}
#board{z-index:4}
.obtns .play.sm{font-size:13px;letter-spacing:.06em;white-space:nowrap;padding:0 6px}
.ghost.wide{width:100%;margin-top:12px}
.bmode{font-size:11px;letter-spacing:.2em;color:var(--muted);font-weight:800;margin:4px 0 10px}
.seg3{grid-template-columns:repeat(3,1fr)}.seg3 button{font-size:11px;padding:9px 2px}
.blist{list-style:none;margin:12px 0 0;max-height:46vh;overflow:auto;text-align:left}
.blist li{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;padding:8px 8px;border-bottom:1px solid rgba(181,108,255,.13);font-size:13.5px}
.blist li b{font-variant-numeric:tabular-nums}
.blist li .r{font-weight:900;color:#a898c8;text-align:center}
.blist li:nth-child(1) .r{color:#e9cf96}.blist li:nth-child(2) .r{color:#e3dcef}.blist li:nth-child(3) .r{color:#d6a37a}
.blist li.me{background:linear-gradient(90deg,rgba(155,92,240,.35),rgba(155,92,240,.08));border-radius:10px}
.blist .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blist .empty{display:block;text-align:center;color:var(--muted);padding:18px 0}
.bme{margin-top:8px;font-size:12px;color:#d9c4ff;min-height:15px}
html.embedded .top{padding-left:78px}
html.embedded .brand{display:none}
@media (max-height:700px){.logo span{font-size:28px}.panel{padding:10px 10px}.lbl{margin:8px 0 5px}.pay{margin-top:8px}.sub{margin:5px 0 8px}.chip{width:46px;height:46px}.play{height:48px}.oscore{font-size:50px}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="player">
      <div class="avatar" id="avatar">M</div>
      <div style="min-width:0">
        <div class="pname" id="pname">Misafir</div>
        <div class="bal"><b id="balance">Ücretsiz</b><small id="cur">OYUN</small></div>
      </div>
    </div>
    <div class="brand">MEYVE KES<small>RINGO</small></div>
    <button class="icon" id="muteBtn" aria-label="Ses">
      <svg viewBox="0 0 24 24" id="sndIcon"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
    </button>
  </header>

  <div class="hud">
    <div class="hcell score"><small>SKOR</small><b id="score">0</b></div>
    <div class="hcell"><small>EN İYİ</small><b id="best">0</b></div>
    <div class="hcell" id="lifeCell">
      <small id="lifeLbl">CAN</small>
      <div class="lives" id="lives"><i></i><i></i><i></i></div>
      <b id="timer">60</b>
    </div>
  </div>

  <div class="cab" id="cab"><div class="tank" id="tank">
      <canvas id="cv"></canvas>
      <div class="glass"></div>
      <div class="go" id="go">KES!</div>
      <div class="toast" id="toast"></div>

      <div class="ov" id="menu"><div class="panel">
        <div class="logo"><span>MEYVE KES</span><em>RINGO</em></div>
        <div class="sub">Kaydır, kes, bombadan kaç</div>
        <div class="seg" id="modeSeg">
          <button data-m="classic" class="on">KLASİK<small>3 can · bomba = son</small></button>
          <button data-m="arcade">ZAMANLI<small>60 sn · bomba −10</small></button>
        </div>
        <div class="lbl">GÜNLÜK XP ÖDÜLÜ</div>
        <div class="pay" id="payTable"></div>
        <button class="play" id="playBtn"><span>OYNA</span><small id="playSub">ÜCRETSİZ</small></button>
        <div class="bestline">En iyi skorun: <b id="menuBest">0</b> · <button class="link" data-board>🏆 Sıralama</button></div>
      </div></div>


      <div class="ov hidden" id="board"><div class="panel">
        <div class="otitle">SIRALAMA</div>
        <div class="bmode" id="bMode">KLASİK</div>
        <div class="seg seg3" id="bTabs"><button data-p="day">BUGÜN</button><button data-p="week" class="on">BU HAFTA</button><button data-p="all">TÜMÜ</button></div>
        <ol class="blist" id="bList"></ol>
        <div class="bme" id="bMe"></div>
        <button class="ghost wide" id="bClose">KAPAT</button>
      </div></div>
      <div class="ov hidden" id="over"><div class="panel">
        <div class="otitle" id="overTitle">OYUN BİTTİ</div>
        <div class="oscore" id="overScore">0</div>
        <div class="olbl">SKOR</div>
        <div class="orow"><span>Kesilen meyve</span><b id="overFruits">0</b></div>
        <div class="orow"><span>En iyi kombo</span><b id="overCombo">–</b></div>
        <div class="oreward zero" id="overReward"></div>
        <div class="orank" id="overRank"></div>
        <div class="obtns">
          <button class="ghost" id="menuBtn">MENÜ</button>
          <button class="ghost sq" data-board aria-label="Sıralama">🏆</button>
          <button class="play sm" id="againBtn">TEKRAR</button>
        </div>
      </div></div>
  </div></div>
</div>

<script>
/* Ringo sitesi bağlantısı: ücretsiz oyun; skor, XP ödülü ve sıralama sunucuda (/api/skill-games). */
window.SLICE_CONFIG = {};
(function () {
  async function j(url, opt) {
    const r = await fetch(url, Object.assign({ credentials: 'same-origin', headers: { 'Content-Type': 'application/json' } }, opt || {}));
    const b = await r.json().catch(() => ({}));
    if (r.status === 401 || r.status === 403) b.error = b.error || 'Oynamak için Ringo hesabınla giriş yapmalısın.';
    b._status = r.status; return b;
  }
  window.SliceHost = {
    async getUser() {
      const prof = await j('/api/profile').catch(() => ({}));
      const p = prof && prof.profile || {};
      return { name: p.display_name || 'Oyuncu', avatar: p.avatar_url || '' };
    },
    async charge(mode) {
      const b = await j('/api/skill-games/start', { method: 'POST', body: JSON.stringify({ game: 'meyve-kes', mode }) });
      if (!b.ok) return { ok: false, error: b.error };
      return { ok: true, sessionId: b.session_id };
    },
    async finish(d) {
      const b = await j('/api/skill-games/finish', { method: 'POST', body: JSON.stringify({ session_id: d.sessionId, score: d.score, fruits: d.fruits, best_combo: d.bestCombo }) });
      if (!b.ok) throw new Error(b.error || 'Sonuç kaydedilemedi.');
      return b;
    },
    async leaderboard(mode, period) {
      return j('/api/skill-games/leaderboard?game=meyve-kes&mode=' + encodeURIComponent(mode) + '&period=' + encodeURIComponent(period));
    }
  };
  if (window.parent !== window) document.documentElement.classList.add('embedded');

<script>
(() => {
'use strict';
/* ================= AYARLAR ================= */
const CFG = Object.assign({
  arcadeSeconds: 60,
  // Ücretsiz oyun. Günlük XP: geçilen her skor basamağı günde bir kez +5 XP (sunucu verir: lib/skill-games.js)
  xp: { classic: [20, 40, 70, 100], arcade: [30, 60, 90, 130] }
}, window.SLICE_CONFIG || {});

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem('mk_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('mk_' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ================= SİTE / PUAN BAĞLANTISI ================= */
const Host = {
  ext: window.SliceHost || null,
  user: { name: 'Misafir', avatar: '' },
  sessionId: null,
  post(type, data) { try { if (window.parent !== window) window.parent.postMessage(Object.assign({ source: 'meyve-kes', type }, data), '*'); } catch (e) {} },
  async init() {
    if (this.ext && this.ext.getUser) {
      try { const u = await this.ext.getUser(); if (u) Object.assign(this.user, u); } catch (e) {}
    }
    window.addEventListener('message', e => {
      const d = e.data || {};
      if (d.type === 'meyve-kes:user') {
        if (d.name) this.user.name = d.name;
        if (d.avatar) this.user.avatar = d.avatar;
        UI.player();
      }
    });
  },
  async charge(mode) {
    if (this.ext && this.ext.charge) {
      try {
        const r = await this.ext.charge(mode);
        if (r === false || (r && r.ok === false)) { this.lastError = r && r.error; return false; }
        this.sessionId = (r && r.sessionId) || null;
        return true;
      } catch (e) { this.lastError = 'Bağlantı hatası.'; return false; }
    }
    this.post('start', { mode });
    return true;
  },
  async finish(data) {
    data.sessionId = this.sessionId;
    if (this.ext && this.ext.finish) {
      try { return await this.ext.finish(data); }
      catch (e) { this.lastError = e.message; return { error: e.message }; }
    }
    this.post('end', data);
  }
};

/* ================= SES (sentez) ================= */
let AC = null, NB = null, muted = store.get('muted', false);
function ac() {

  const n = trail.length, L = [], Rr = [];
  for (let i = 0; i < n; i++) {
    const p = trail[i], q = trail[Math.min(n - 1, i + 1)], o = trail[Math.max(0, i - 1)];
    const a = Math.atan2(q.y - o.y, q.x - o.x), k = (i / (n - 1)) * (1 - (now - p.t) / life), w = 1 + k * 9;
    L.push([p.x + Math.cos(a + Math.PI / 2) * w, p.y + Math.sin(a + Math.PI / 2) * w]); Rr.push([p.x - Math.cos(a + Math.PI / 2) * w, p.y - Math.sin(a + Math.PI / 2) * w]);
  }
  const poly = () => { ctx.beginPath(); L.forEach(([x, y], i) => { i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); for (let i = n - 1; i >= 0; i--) ctx.lineTo(Rr[i][0], Rr[i][1]); ctx.closePath(); };
  ctx.save(); ctx.shadowColor = 'rgba(150,70,255,.9)'; ctx.shadowBlur = 12; ctx.fillStyle = 'rgba(170,95,255,.9)'; poly(); ctx.fill(); ctx.restore();
  // beyaz çekirdek
  ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let i = 1; i < n; i++) { ctx.lineWidth = 1 + (i / n) * 3; ctx.beginPath(); ctx.moveTo(trail[i - 1].x, trail[i - 1].y); ctx.lineTo(trail[i].x, trail[i].y); ctx.stroke(); }
}

/* ---------- dokunma ---------- */
let down = false, lastP = null, lastSw = 0;
const pos = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, t: performance.now() }; };
cv.addEventListener('pointerdown', e => { down = true; try { cv.setPointerCapture(e.pointerId); } catch (_) {} lastP = pos(e); trail = [lastP]; ac(); e.preventDefault(); });
cv.addEventListener('pointermove', e => {
  if (!down) return; const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of evs) {
    const p = pos(ev); const d = Math.hypot(p.x - lastP.x, p.y - lastP.y); if (d < 2) continue;
    trail.push(p); if (trail.length > 40) trail.shift();
    const speed = d / Math.max(1, p.t - lastP.t);
    if (speed > .25) cutTest(lastP, p);
    if (speed > .9 && p.t - lastSw > 170) { lastSw = p.t; SFX.swoosh(); }
    lastP = p;
  }
  e.preventDefault();
});
const up = () => { down = false; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up); cv.addEventListener('pointerleave', up);
document.addEventListener('touchmove', e => { if (e.target === cv) e.preventDefault(); }, { passive: false });

/* ================= ARAYÜZ ================= */
const fmt = n => Math.round(n).toLocaleString('tr-TR');
const UI = {
  player() {
    $('pname').textContent = Host.user.name || 'Misafir';
    const av = $('avatar');
    if (Host.user.avatar) { av.style.backgroundImage = `url("${Host.user.avatar}")`; av.textContent = ''; }
    else av.textContent = (Host.user.name || 'M').trim().charAt(0).toLocaleUpperCase('tr-TR');
    this.menu();
  },
  hud() {
    $('score').textContent = G ? G.score : 0;
    const best = store.get('best_' + mode, 0); $('best').textContent = Math.max(best, G && state === 'play' ? G.score : 0);
    const cl = mode === 'classic';
    $('lives').style.display = cl ? 'flex' : 'none'; $('timer').style.display = cl ? 'none' : 'block';
    $('lifeLbl').textContent = cl ? 'CAN' : 'SÜRE';
    const lost = G && cl ? 3 - G.lives : 0;
    [...$('lives').children].forEach((el, i) => { const was = el.classList.contains('lost'); const now = i >= 3 - lost; el.classList.toggle('lost', now); if (now && !was) { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; } });
    this.timer();
  },
  timer() {
    const t = G && state === 'play' ? Math.ceil(G.left) : CFG.arcadeSeconds;
    $('timer').textContent = t; $('lifeCell').classList.toggle('danger', mode === 'arcade' && t <= 10 && state === 'play');
  },
  menu() {
    [...$('modeSeg').children].forEach(b => b.classList.toggle('on', b.dataset.m === mode));
    $('payTable').innerHTML = CFG.xp[mode].map(m => `<div>${m}+ skor<b>+5 XP</b></div>`).join('');
    $('menuBest').textContent = store.get('best_' + mode, 0);
    this.hud();
  },
  toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200); }
};
$('modeSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; mode = b.dataset.m; store.set('mode', mode); UI.menu(); });
$('playBtn').addEventListener('click', start);
$('againBtn').addEventListener('click', start);
$('menuBtn').addEventListener('click', () => { $('over').classList.add('hidden'); $('menu').classList.remove('hidden'); state = 'menu'; UI.menu(); });
$('muteBtn').addEventListener('click', () => { muted = !muted; store.set('muted', muted); setIcon(); if (!muted) { ac(); SFX.tick(); } });
function setIcon() { $('sndIcon').innerHTML = muted ? '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/>' : '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>'; }

let starting = false;
async function start() {
  if (starting) return; ac();
  starting = true;
  const ok = await Host.charge(mode);
  starting = false;
  if (!ok) { UI.toast(Host.lastError || 'Oyun başlatılamadı'); UI.menu(); return; }
  newGame(); state = 'play';
  $('menu').classList.add('hidden'); $('over').classList.add('hidden');
  const go = $('go'); go.classList.remove('anim'); void go.offsetWidth; go.classList.add('anim'); SFX.go();
  UI.hud();
}
async function finishGame() {
  state = 'over'; flushCombo();
  const bestKey = 'best_' + mode, prev = store.get(bestKey, 0), isBest = G.score > prev;
  if (isBest) store.set(bestKey, G.score);
  $('overTitle').textContent = isBest && G.score > 0 ? 'YENİ REKOR!' : (G.reason || 'OYUN BİTTİ');
  $('overScore').textContent = G.score; $('overFruits').textContent = G.fruits;
  $('overCombo').textContent = G.bestCombo >= 3 ? G.bestCombo + 'x' : '–';
  const rw = $('overReward'), rank = $('overRank');
  const paint = (t, on) => { rw.textContent = t; rw.classList.toggle('zero', !on); rw.style.display = t ? '' : 'none'; };
  paint(''); rank.textContent = Host.ext ? 'Sonuç kaydediliyor…' : '';
  $('over').classList.remove('hidden');
  const r = await Host.finish({ mode, score: G.score, fruits: G.fruits, bestCombo: G.bestCombo });
  if (r && r.error) { rank.textContent = r.error; }
  else if (r && r.ok) {
    if (r.status === 'rejected') paint('Skor doğrulanamadı');
    else if (r.status === 'expired') paint('Oyun süresi aşıldı');
    else if (r.xp > 0) paint(`+${r.xp} XP`, true);
    else if (r.kademe > 0) paint('Bugünkü XP ödülünü aldın');
    rank.textContent = r.week_rank ? `Bu haftaki sıralamada ${r.week_rank}. sıradasın` : '';
  } else rank.textContent = '';
  UI.menu();
}

/* ===== Sıralama tablosu ===== */
let boardPeriod = 'week';
async function openBoard() {
  if (!Host.ext || !Host.ext.leaderboard) { UI.toast('Sıralama sitede çalışır'); return; }
  $('board').classList.remove('hidden'); $('bMode').textContent = mode === 'classic' ? 'KLASİK MOD' : 'ZAMANLI MOD';
  [...$('bTabs').children].forEach(b => b.classList.toggle('on', b.dataset.p === boardPeriod));
  $('bList').innerHTML = '<li class="empty">Yükleniyor…</li>'; $('bMe').textContent = '';
  try {
    const r = await Host.ext.leaderboard(mode, boardPeriod);
    if (!r.ok) throw new Error(r.error || 'Sıralama yüklenemedi');
    const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    $('bList').innerHTML = r.top.length ? r.top.map(x => `<li class="${x.me ? 'me' : ''}"><span class="r">${x.rank}</span><span class="n">${esc(x.name)}${x.me ? ' (sen)' : ''}</span><b>${fmt(x.score)}</b></li>`).join('')
      : '<li class="empty">Henüz skor yok. İlk sen ol!</li>';
    $('bMe').textContent = r.me && !r.top.some(x => x.me) ? `Senin sıran: ${r.me.rank} · ${fmt(r.me.score)} skor` : '';
  } catch (e) { $('bList').innerHTML = `<li class="empty">${e.message}</li>`; }
}
document.addEventListener('click', e => { if (e.target.closest('[data-board]')) openBoard(); });
$('bTabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; boardPeriod = b.dataset.p; openBoard(); });
$('bClose').addEventListener('click', () => $('board').classList.add('hidden'));
document.addEventListener('visibilitychange', () => { paused = document.hidden; last = performance.now(); });

/* ================= DÖNGÜ ================= */
let last = performance.now(), paused = false;
function frame(now) {
  const dt = Math.min(.04, (now - last) / 1000); last = now;
  if (!paused && W > 0) { update(dt); render(now); }
  requestAnimationFrame(frame);
}
let rT; window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(resize, 120); });
(async function boot() { setIcon(); await loadPhotos(); resize(); await Host.init(); UI.player(); requestAnimationFrame(frame); })();
})();
</script>
