(function(){
  function fit(){
    document.querySelectorAll('#homeDiscoverSection .discover-hotspot-label').forEach(function(el){
      var card=el.closest('.ringo-discover-home-card');if(!card||!card.clientWidth)return;
      var W=card.clientWidth,size=W*0.044,min=W*0.034;
      // 1) Tek satır: sığana kadar küçült
      el.style.whiteSpace='nowrap';el.style.fontSize=size+'px';
      while(size>min&&el.scrollWidth>el.clientWidth+1){size-=0.25;el.style.fontSize=size+'px';}
      if(el.scrollWidth<=el.clientWidth+1)return;
      // 2) Sığmadıysa kelime aralarından 2 satır (kelime ortadan bölünmez)
      size=W*0.04;el.style.whiteSpace='normal';el.style.fontSize=size+'px';
      while(size>W*0.026&&(el.scrollWidth>el.clientWidth+1||el.offsetHeight>size*1.08*2+2)){size-=0.25;el.style.fontSize=size+'px';}
    });
  }
  window.addEventListener('ringo:language-change',function(){requestAnimationFrame(fit);});
  window.addEventListener('resize',fit);
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',fit);else fit();
  setTimeout(fit,600);
})();

<script>
/* RİNGO LIVE PK şeridi: ortadaki kart büyür ve parlar, yan kartlar küçülüp solar. */
(function(){
  var track=document.getElementById("ringoPkTrack");
  if(!track)return;
  var cards=[].slice.call(track.querySelectorAll(".ringo-pk-home-room"));
  if(!cards.length)return;
  var START_INDEX=1,raf=0,touched=false;
  function update(){
    raf=0;
    var tr=track.getBoundingClientRect(),mid=tr.left+tr.width/2,pitch=cards[0].offsetWidth+10,best=0,bestD=1e9;
    cards.forEach(function(c,i){
      var r=c.getBoundingClientRect(),d=Math.abs(r.left+r.width/2-mid)/pitch;
      if(d<bestD){bestD=d;best=i}
      var k=Math.min(d,1);
      c.style.transform="scale("+(1.14-.26*k).toFixed(3)+")";
      c.style.opacity=(1-.38*k-(d>1?Math.min(d-1,1)*.3:0)).toFixed(2);
      c.style.zIndex=String(Math.round((2-Math.min(d,2))*10));
    });
    cards.forEach(function(c,i){c.classList.toggle("is-center",i===best)});
  }
  function start(){
    var c=cards[Math.min(START_INDEX,cards.length-1)];
    track.scrollLeft=c.offsetLeft-(track.clientWidth-c.offsetWidth)/2;
    update();
  }
  track.addEventListener("scroll",function(){if(!raf)raf=requestAnimationFrame(update)},{passive:true});
  track.addEventListener("touchstart",function(){touched=true},{passive:true});
  window.addEventListener("resize",function(){if(!touched)start();else update()});
  window.addEventListener("load",function(){if(!touched)start()});
  start();
})();

})();

<script id="ringoLanguagePickerScript">
(function(){
  var root=document.getElementById("ringoLanguagePicker");
  var trigger=document.getElementById("ringoLanguageTrigger");
  var current=document.getElementById("ringoLanguageCurrent");
  var menu=document.getElementById("ringoLanguageMenu");
  var i18n=window.RINGO_I18N;
  if(!root||!trigger||!current||!menu||!i18n||root.dataset.ready==="1")return;
  root.dataset.ready="1";
  var labels={tr:"Türkçe",en:"English",de:"Deutsch",fr:"Français",es:"Español",it:"Italiano",pt:"Português",ru:"Русский",ar:"العربية","zh-Hans":"中文",ja:"日本語",ko:"한국어"};
  var codes={tr:"TR",en:"EN",de:"DE",fr:"FR",es:"ES",it:"IT",pt:"PT",ru:"RU",ar:"AR","zh-Hans":"ZH",ja:"JA",ko:"KO"};
  var lang=i18n.getLanguage();
  function paint(){
    lang=i18n.getLanguage();
    current.textContent=codes[lang]||"TR";
    trigger.setAttribute("aria-label",i18n.t("language.select")+": "+(labels[lang]||labels.tr));
    menu.querySelectorAll("[data-lang]").forEach(function(item){
      item.setAttribute("aria-selected",item.getAttribute("data-lang")===lang?"true":"false");
    });
  }
  function close(){root.classList.remove("is-open");trigger.setAttribute("aria-expanded","false");}
  trigger.addEventListener("click",function(){
    var open=!root.classList.contains("is-open");
    root.classList.toggle("is-open",open);
    trigger.setAttribute("aria-expanded",open?"true":"false");
  });
  menu.addEventListener("click",function(event){
    var option=event.target.closest("[data-lang]");
    if(!option)return;
    var next=option.getAttribute("data-lang");
    if(!i18n.setLanguage(next,{userSelected:true}))return;
    paint();close();
  });
  document.addEventListener("click",function(event){if(!root.contains(event.target))close();});
  document.addEventListener("keydown",function(event){if(event.key==="Escape")close();});
  window.addEventListener("ringo:language-change",paint);
  paint();
})();
</script>
